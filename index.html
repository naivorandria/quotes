<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quotes</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="fixed-header" role="banner">
    <div class="header-top">
      <span class="brand neo-title">quotes</span>
      <div class="header-actions">
        <button id="copy-quote" class="copy-btn square-btn" aria-label="Copy quote">
          <span id="copy-label" class="copy-label">Copy</span>
        </button>
      </div>
    </div>
  </header>

  <section class="quote-card" id="quote-card" aria-describedby="quote-live">
    <blockquote class="quote-text" id="quote-text"></blockquote>
    <cite class="quote-author" id="quote-author"></cite>
  </section>

  <main class="page-body" role="main" aria-label="Random quote viewer" tabindex="0">
    <div class="hint" aria-hidden="true">Tap/click or press Space for a new quote.</div>
    <div class="sr-only" id="quote-live" aria-live="polite"></div>
  </main>
</body>
</html>
